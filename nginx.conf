events {
    worker_connections 1024;
}

http {
    upstream asr_mcp {
        server asr-mcp:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # MCP endpoint with authentication
        location /asr-mcp/mcp {
            proxy_pass http://asr_mcp/mcp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            auth_basic "Restricted Area";
            auth_basic_user_file /app/htpasswd;
        }

        location /mcp {
            proxy_pass http://asr_mcp/mcp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            auth_basic "Restricted Area";
            auth_basic_user_file /app/htpasswd;
        }

        # REST API (no auth required)
        location /api {
            proxy_pass http://asr_mcp/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # GUI dashboard
        location /gui {
            proxy_pass http://asr_mcp/gui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://asr_mcp/health;
            proxy_set_header Host $host;
        }
    }
}
