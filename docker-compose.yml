version: '3.8'

services:
  asr-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asr-mcp-app
    ports:
      - "8086:8080"
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
      - TRANSCRIBE_CUDA_DEVICE=cuda:0
      - TRANSCRIBE_HOST=0.0.0.0
      - TRANSCRIBE_PORT=8080
      - TRANSCRIBE_DATA_DIR=/app/data
      - TRANSCRIBE_LOG_DIR=/app/logs
      - TRANSCRIBE_MODEL_CACHE_DIR=/app/models
      - TRANSCRIBE_DB_PATH=/app/data/asr_mcp.db
      - TRANSCRIBE_HTPASSWD_PATH=/app/htpasswd
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: asr-mcp-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./htpasswd:/app/htpasswd:ro
    depends_on:
      - asr-mcp
    restart: unless-stopped
