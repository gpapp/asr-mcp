services:
  asr-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asr-mcp-app
    ports:
      - "8087:8080"
    environment:
      - TRANSCRIBE_SESSION_SECRET=${TRANSCRIBE_SESSION_SECRET}
      - TRANSCRIBE_CUDA_DEVICE=cuda:0
      - TRANSCRIBE_HOST=0.0.0.0
      - TRANSCRIBE_PORT=8080
      - TRANSCRIBE_DATA_DIR=/app/data
      - TRANSCRIBE_LOG_DIR=/app/logs
      - TRANSCRIBE_VOICES_DIR=/app/voices
      - TRANSCRIBE_MODEL_CACHE_DIR=/app/models
      - TRANSCRIBE_DB_PATH=/app/data/asr_mcp.db
      - TRANSCRIBE_HTPASSWD_PATH=/app/data/.htpasswd
      - TRANSCRIBE_PREFIX=/asr-mcp
      - TRANSCRIBE_LOG_LEVEL=${TRANSCRIBE_LOG_LEVEL:-INFO}
      - TRANSCRIBE_MODEL_TTL_MINUTES=${TRANSCRIBE_MODEL_TTL_MINUTES:-5}
      - TRANSCRIBE_ASR_MODEL=${TRANSCRIBE_ASR_MODEL:-cohere}
      - TRANSCRIBE_QWEN_MODEL_NAME=${TRANSCRIBE_QWEN_MODEL_NAME:-Qwen/Qwen3-ASR-1.7B}
      - TRANSCRIBE_QWEN_MODEL_DIR=/app/models/qwen3-asr
      - TRANSCRIBE_QWEN_FORCED_ALIGNER_NAME=${TRANSCRIBE_QWEN_FORCED_ALIGNER_NAME:-Qwen/Qwen3-ForcedAligner-0.6B}
      - TRANSCRIBE_QWEN_FORCED_ALIGNER_DIR=/app/models/qwen3-forced-aligner
      - TRANSCRIBE_QWEN_TORCH_DTYPE=${TRANSCRIBE_QWEN_TORCH_DTYPE:-float16}
      - TRANSCRIBE_QWEN_MAX_NEW_TOKENS=${TRANSCRIBE_QWEN_MAX_NEW_TOKENS:-256}
      - TRANSCRIBE_QWEN_MAX_INFERENCE_BATCH_SIZE=${TRANSCRIBE_QWEN_MAX_INFERENCE_BATCH_SIZE:-8}
      - TRANSCRIBE_QWEN_QUANTIZE_4BIT=${TRANSCRIBE_QWEN_QUANTIZE_4BIT:-true}
    volumes:
      - ${DATA_DIR:-.}/data:/app/data
      - ${DATA_DIR:-.}/logs:/app/logs
      - ${DATA_DIR:-.}/models:/app/models
      - ${DATA_DIR:-.}/voices:/app/voices
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
